<style>
  :root {
    --azul-institucional: #003366;
    --azul-secundario: #155E9A;
    --verde: #2E7D32;
    --azul-claro: #EAF3F9;
    --cinza-claro: #F5F7FA;
    --cinza-borda: #D8E0E8;
    --cinza-texto: #37474F;
    --cinza-suave: #546E7A;
    --branco: #FFFFFF;
    --vermelho-alerta: #C62828;
    --amarelo-atencao: #F9A825;
    --sombra-card: 0 2px 8px rgba(0, 51, 102, 0.07);
    --sombra-hover: 0 6px 18px rgba(0, 51, 102, 0.13);
    --radius: 8px;
    --font-scale: 1;
  }

  /* Modo Alto Contraste WCAG 2.1 AA */
  html[data-contrast="high"] {
    --azul-institucional: #000000;
    --azul-secundario: #001F4D;
    --verde: #004D00;
    --azul-claro: #FFFF00;
    --cinza-claro: #FFFFFF;
    --cinza-borda: #000000;
    --cinza-texto: #000000;
    --cinza-suave: #000000;
    --branco: #FFFFFF;
    --sombra-card: none;
    --sombra-hover: none;
  }

  html {
    font-size: calc(16px * var(--font-scale));
    box-sizing: border-box;
    scroll-behavior: smooth;
  }

  *, *::before, *::after {
    box-sizing: inherit;
  }

  body {
    margin: 0;
    font-family: Arial, "Segoe UI", Roboto, sans-serif;
    background-color: var(--cinza-claro);
    color: var(--cinza-texto);
    line-height: 1.55;
  }

  /* Foco visível acessível para navegação por teclado */
  :focus-visible {
    outline: 3px solid var(--amarelo-atencao);
    outline-offset: 2px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
  }

  .skip-link {
    position: absolute;
    left: -9999px;
    top: 8px;
    background: var(--azul-institucional);
    color: var(--branco);
    padding: 10px 16px;
    z-index: 9999;
    border-radius: 4px;
    text-decoration: none;
    font-weight: bold;
  }

  .skip-link:focus {
    left: 12px;
  }

  .hidden {
    display: none !important;
  }

  .container {
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Barra Superior de Acessibilidade */
  .top-utility-bar {
    background-color: var(--azul-institucional);
    color: var(--branco);
    font-size: 0.8125rem;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
  }

  .utility-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .accessibility-controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .version-badge {
    background: rgba(255, 255, 255, 0.16);
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: bold;
    margin-right: 6px;
  }

  .btn-a11y {
    background: transparent;
    color: var(--branco);
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: 4px;
    padding: 3px 9px;
    font-size: 0.8rem;
    cursor: pointer;
    min-height: 28px;
  }

  .btn-a11y:hover, .btn-a11y[aria-pressed="true"] {
    background: var(--branco);
    color: var(--azul-institucional);
    font-weight: bold;
  }

  /* Cabeçalho Institucional */
  .site-header {
    background: var(--branco);
    border-bottom: 1px solid var(--cinza-borda);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 12px;
    padding-bottom: 12px;
    gap: 16px;
  }

  .brand-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-logo img, .brand-logo svg {
    display: block;
    max-height: 46px;
    width: auto;
  }

  .brand-kicker {
    display: block;
    font-size: 0.75rem;
    font-weight: bold;
    text-transform: uppercase;
    color: var(--azul-secundario);
    letter-spacing: 0.4px;
  }

  .brand-title {
    margin: 0;
    font-size: 1.15rem;
    color: var(--azul-institucional);
    line-height: 1.25;
  }

  .nav-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }

  .nav-link {
    background: transparent;
    border: none;
    color: var(--cinza-texto);
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 9px 12px;
    border-radius: 6px;
    cursor: pointer;
    min-height: 40px;
  }

  .nav-link:hover {
    background: var(--azul-claro);
    color: var(--azul-institucional);
  }

  .nav-link.active {
    background: var(--azul-institucional);
    color: var(--branco);
  }

  .nav-link-admin {
    border: 1px solid var(--verde);
    color: var(--verde);
  }

  .nav-link-admin.active {
    background: var(--verde);
    color: var(--branco);
  }

  .mobile-menu-toggle {
    display: none;
    background: var(--azul-institucional);
    color: var(--branco);
    border: none;
    padding: 10px 14px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    min-height: 44px;
  }

  /* Área de Destaque (Hero) */
  .hero-section {
    background: linear-gradient(135deg, var(--azul-institucional) 0%, var(--azul-secundario) 100%);
    color: var(--branco);
    padding: 40px 0 36px;
  }

  .hero-inner {
    text-align: center;
    max-width: 880px;
  }

  .hero-title {
    margin: 0 0 10px;
    font-size: 1.95rem;
    font-weight: bold;
  }

  .hero-subtitle {
    margin: 0 auto 24px;
    font-size: 1.05rem;
    opacity: 0.95;
    max-width: 720px;
  }

  .search-box-wrapper {
    max-width: 760px;
    margin: 0 auto;
  }

  .search-input-group {
    display: flex;
    background: var(--branco);
    border-radius: var(--radius);
    padding: 5px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
    align-items: center;
    gap: 4px;
  }

  .search-input {
    flex: 1;
    border: none;
    padding: 12px 14px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--cinza-texto);
    background: transparent;
    min-width: 0;
  }

  .search-input:focus {
    outline: none;
  }

  .btn-clear-search {
    background: transparent;
    border: none;
    color: var(--cinza-suave);
    font-size: 1.1rem;
    padding: 8px 10px;
    cursor: pointer;
    min-height: 40px;
  }

  .search-submit {
    padding: 12px 24px;
    font-size: 1rem;
    min-height: 46px;
  }

  .search-suggestions {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }

  .suggestions-label {
    font-size: 0.85rem;
    font-weight: bold;
    opacity: 0.9;
  }

  .chip-suggestion {
    background: rgba(255, 255, 255, 0.14);
    color: var(--branco);
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 0.82rem;
    cursor: pointer;
    min-height: 32px;
  }

  .chip-suggestion:hover {
    background: var(--branco);
    color: var(--azul-institucional);
  }

  /* Botões Padrão */
  .btn-primary {
    background: var(--azul-institucional);
    color: var(--branco);
    border: 1px solid var(--azul-institucional);
    border-radius: 6px;
    padding: 10px 16px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 42px;
  }

  .btn-primary:hover {
    background: var(--azul-secundario);
    border-color: var(--azul-secundario);
  }

  .btn-secondary {
    background: var(--branco);
    color: var(--azul-institucional);
    border: 1px solid var(--azul-secundario);
    border-radius: 6px;
    padding: 9px 14px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 42px;
  }

  .btn-secondary:hover {
    background: var(--azul-claro);
  }

  .btn-success {
    background: var(--verde);
    color: var(--branco);
    border: 1px solid var(--verde);
    border-radius: 6px;
    padding: 9px 14px;
    font-weight: bold;
    cursor: pointer;
    min-height: 42px;
  }

  .btn-link, .btn-link-sm {
    background: none;
    border: none;
    color: var(--azul-secundario);
    font-weight: bold;
    cursor: pointer;
    text-decoration: underline;
    padding: 4px;
  }

  .btn-link-sm {
    font-size: 0.82rem;
  }

  /* Conteúdo Principal */
  .main-content {
    padding-top: 28px;
    padding-bottom: 48px;
    min-height: 60vh;
  }

  .section-block {
    margin-bottom: 32px;
  }

  .section-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 12px;
  }

  .section-title {
    margin: 0;
    font-size: 1.3rem;
    color: var(--azul-institucional);
  }

  .section-desc {
    margin: 4px 0 0;
    color: var(--cinza-suave);
  }

  /* Grade Rápida de Temas */
  .themes-grid-compact {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  .themes-grid-full {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }

  .theme-card {
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    border-left: 4px solid var(--azul-secundario);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--sombra-card);
    cursor: pointer;
    text-align: left;
    transition: box-shadow 0.15s ease;
  }

  .theme-card:hover {
    box-shadow: var(--sombra-hover);
    border-color: var(--azul-institucional);
  }

  .theme-card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .theme-count {
    background: var(--azul-claro);
    color: var(--azul-institucional);
    font-size: 0.78rem;
    font-weight: bold;
    padding: 3px 9px;
    border-radius: 12px;
  }

  .theme-card h3 {
    margin: 0 0 6px;
    font-size: 1rem;
    color: var(--azul-institucional);
  }

  .theme-card p {
    margin: 0;
    font-size: 0.85rem;
    color: var(--cinza-suave);
  }

  /* Layout Catálogo + Filtros */
  .catalog-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 18px;
    gap: 12px;
  }

  .results-counter {
    margin: 4px 0 0;
    font-size: 0.9rem;
    color: var(--cinza-suave);
  }

  .catalog-layout {
    display: grid;
    grid-template-columns: 270px 1fr;
    gap: 24px;
    align-items: start;
  }

  .filters-panel {
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--sombra-card);
  }

  .filters-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--cinza-borda);
  }

  .filters-header h3 {
    margin: 0;
    font-size: 1.05rem;
    color: var(--azul-institucional);
  }

  .filter-group {
    margin-bottom: 14px;
  }

  .filter-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: bold;
    margin-bottom: 5px;
    color: var(--cinza-texto);
  }

  .form-control {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--cinza-borda);
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.9rem;
    background: var(--branco);
    color: var(--cinza-texto);
    min-height: 40px;
  }

  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .checkbox-group label {
    margin-bottom: 0;
    font-weight: normal;
    cursor: pointer;
  }

  /* Grade de Cartões de Resultado */
  .results-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }

  .content-card {
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--sombra-card);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .content-card.is-featured {
    border-top: 4px solid var(--verde);
  }

  .card-badges {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
  }

  .badge-tema {
    font-size: 0.74rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--azul-secundario);
    background: var(--azul-claro);
    padding: 3px 8px;
    border-radius: 4px;
  }

  .badge-destaque {
    font-size: 0.74rem;
    font-weight: bold;
    color: var(--branco);
    background: var(--verde);
    padding: 3px 8px;
    border-radius: 4px;
  }

  .card-title {
    margin: 0 0 8px;
    font-size: 1.1rem;
    color: var(--azul-institucional);
    line-height: 1.35;
  }

  .card-summary {
    margin: 0 0 14px;
    font-size: 0.92rem;
    color: var(--cinza-texto);
  }

  .card-meta-list {
    font-size: 0.83rem;
    color: var(--cinza-suave);
    background: var(--cinza-claro);
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 10px;
  }

  .card-keywords {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 14px;
  }

  .kw-tag {
    font-size: 0.75rem;
    background: var(--cinza-claro);
    border: 1px solid var(--cinza-borda);
    padding: 2px 7px;
    border-radius: 4px;
    color: var(--cinza-suave);
  }

  .card-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    padding-top: 10px;
    border-top: 1px solid var(--cinza-borda);
  }

  .card-actions .btn-primary,
  .card-actions .btn-secondary {
    flex: 1;
  }

  /* Paginação */
  .pagination-nav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 26px;
    flex-wrap: wrap;
  }

  .page-btn {
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    color: var(--azul-institucional);
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    min-height: 40px;
  }

  .page-btn.active {
    background: var(--azul-institucional);
    color: var(--branco);
    border-color: var(--azul-institucional);
  }

  .page-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  /* Estados de Carregamento, Erro e Vazio */
  .status-box, .empty-state, .institutional-card {
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--sombra-card);
  }

  .loading-box {
    text-align: center;
    margin-bottom: 24px;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 4px solid var(--azul-claro);
    border-top-color: var(--azul-institucional);
    border-radius: 50%;
    margin: 0 auto 12px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .error-box {
    border-left: 5px solid var(--vermelho-alerta);
    margin-bottom: 24px;
  }

  .empty-state h3 {
    margin-top: 0;
    color: var(--azul-institucional);
  }

  .chips-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }

  .chip-alt {
    background: var(--azul-claro);
    color: var(--azul-institucional);
    border: 1px solid var(--azul-secundario);
    border-radius: 16px;
    padding: 5px 12px;
    cursor: pointer;
    font-weight: bold;
    font-size: 0.85rem;
  }

  /* Acordeão FAQ */
  .accordion-item {
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
  }

  .accordion-trigger {
    width: 100%;
    text-align: left;
    background: var(--branco);
    border: none;
    padding: 16px 20px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: bold;
    color: var(--azul-institucional);
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    min-height: 52px;
  }

  .accordion-panel {
    padding: 0 20px 18px;
    border-top: 1px solid var(--cinza-borda);
    color: var(--cinza-texto);
  }

  /* Modal de Detalhes e Admin */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 20, 45, 0.62);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 500;
  }

  .modal-dialog {
    background: var(--branco);
    border-radius: var(--radius);
    width: 100%;
    max-width: 780px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 26px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
    position: relative;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--cinza-borda);
    margin-bottom: 16px;
  }

  .modal-close {
    background: var(--cinza-claro);
    border: 1px solid var(--cinza-borda);
    border-radius: 6px;
    font-size: 1.1rem;
    padding: 6px 12px;
    cursor: pointer;
    min-height: 40px;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px 16px;
    background: var(--cinza-claro);
    padding: 14px;
    border-radius: 6px;
    margin: 16px 0;
    font-size: 0.9rem;
  }

  .modal-actions-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 18px 0;
  }

  .feedback-widget {
    background: var(--azul-claro);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 18px;
  }

  .feedback-buttons {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  .related-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 10px;
  }

  .related-item-btn {
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    border-radius: 6px;
    padding: 10px 12px;
    text-align: left;
    cursor: pointer;
  }

  .related-item-btn:hover {
    border-color: var(--azul-secundario);
    background: var(--azul-claro);
  }

  /* Painel Administrativo */
  .admin-kpis {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin: 18px 0;
  }

  .kpi-card {
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    border-top: 4px solid var(--azul-institucional);
    border-radius: var(--radius);
    padding: 16px;
  }

  .kpi-value {
    display: block;
    font-size: 1.75rem;
    font-weight: bold;
    color: var(--azul-institucional);
  }

  .admin-actions-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }

  .table-responsive {
    overflow-x: auto;
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    border-radius: var(--radius);
    margin-bottom: 20px;
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }

  .data-table th, .data-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--cinza-borda);
    text-align: left;
  }

  .data-table th {
